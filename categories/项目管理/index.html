<script>
(function () {
    var overlay = document.getElementById('pagefind-overlay');
    var modal = overlay.querySelector('.pf-modal');
    var closeBtn = document.getElementById('pagefind-close');
    var uiMount = document.getElementById('pagefind-ui');

    function open() {
        overlay.classList.add('open');
        overlay.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        var input = uiMount.querySelector('input');
        if (input) { setTimeout(function () { input.focus(); }, 60); }
    }
    function close() {
        overlay.classList.remove('open');
        overlay.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
    }

    function bindTrigger(id) {
        var el = document.getElementById(id);
        if (el) { el.addEventListener('click', function (e) { e.preventDefault(); open(); }); }
    }
    bindTrigger('pagefind-trigger-desktop');
    bindTrigger('pagefind-trigger-mobile');

    closeBtn.addEventListener('click', close);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && overlay.classList.contains('open')) { close(); }
    });
